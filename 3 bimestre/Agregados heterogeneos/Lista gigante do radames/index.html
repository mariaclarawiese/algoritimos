<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produto</title>
  </head>

  <body>
    <input
      type="button"
      value="ex03 - Listar Produtos"
      onclick="listarTodosOsProdutos()"
    /><br />
    <input
      type="button"
      value="ex04 - Produto Mais Pesado"
      onclick="mostrarProdutoMaisPesado()"
    /><br />
    <input
      type="button"
      value="ex05 - Produto Mais Leve"
      onclick="mostrarProdutoMaisLeve()"
    /><br />
    <input
      type="button"
      value="ex06 - Produto Mais Caro"
      onclick="ProdutoMaisCaro()"
    /><br />
    <input
      type="button"
      value="ex07 - Produto Mais Barato"
      onclick="ProdutoMaisBarato()"
    /><br />
    <input
      type="button"
      value="ex08 - Média dos preços"
      onclick="MediaDePrecos()"
    /><br />
    <input
      type="button"
      value="ex09 - Média dos pesos"
      onclick="MediaDePeso()"
    /><br />
    <input
      type="button"
      value="ex10 - Alerta de Baixo Estoque"
      onclick="AlertaEstoque()"
    /><br />
    <input
      type="button"
      value="ex11 - Produtos até 100R$"
      onclick="FiltroPreco()"
    /><br />
    <input type="text" id="buscado" />
    <input
      type="button"
      value="ex12 - Buscar Por Nome"
      onclick="BuscarNome()"
    /><br />
    <input
      type="button"
      value="ex13 - Valor em estoque"
      onclick="ValorEmEstoque()"
    /><br />
    <input
      type="button"
      value="ex14 - Valor Total do Patrimônio"
      onclick="ValorTotal()"
    /><br />
    <input
      type="button"
      value="ex15 - Quantidade Total Em Estoque"
      onclick="TotalPecas()"
    /><br />
    <input
      type="button"
      value="ex16 - Peso Total Da Carga"
      onclick="PesoTotalCarga()"
    /><br />
    <input
      type="number"
      id="quantidade"
      placeholder="Quantidade recebida"
    /><input type="number" id="id" placeholder="Id" /><button
      onclick="EntradaMercadoria()"
    >
      ex17 - Entrada de Mercadoria</button
    ><br />
    <button onclick="DescontoPromocional()">ex18 - Desconto Promocional</button>
    <br />
    <input
      type="button"
      value="ex19 - Contagem por Categoria de Preço"
      onclick="ContagemPorCategoria()"
    /><br />
    <input
      type="button"
      value="ex20 - Ordenação por Preço"
      onclick="OrdenarPreco()"
    /><br /><br />
    <span id="resposta"></span>

    <script src="produto.js"></script>

    <script>
      let listaProdutos = [];
      // Instanciando todos os produtos
      let produto = new Produto(1, "Bola de Futebol Campo", 89.9, 0.45, 30);
      listaProdutos.push(produto);

      produto = new Produto(2, "Chuteira Society", 199.9, 0.7, 15);
      listaProdutos.push(produto);

      produto = new Produto(3, "Raquete de Tênis", 350.0, 0.3, 8);
      listaProdutos.push(produto);

      produto = new Produto(4, "Bola de Basquete", 120.0, 0.62, 20);
      listaProdutos.push(produto);

      produto = new Produto(5, "Kettlebell 12kg", 180.0, 12.0, 5);
      listaProdutos.push(produto);

      produto = new Produto(6, "Caneleira de Futebol", 35.0, 0.15, 40);
      listaProdutos.push(produto);

      produto = new Produto(7, "Luva de Boxe 12oz", 150.0, 0.8, 12);
      listaProdutos.push(produto);

      produto = new Produto(8, "Prancha Stand Up Paddle", 2500.0, 11.5, 2);
      listaProdutos.push(produto);

      produto = new Produto(9, "Óculos de Natação", 45.0, 0.08, 50);
      listaProdutos.push(produto);

      produto = new Produto(10, "Colchonete de Yoga", 65.0, 0.9, 25);
      listaProdutos.push(produto);

      produto = new Produto(11, "Anilha de Ferro 10kg", 130.0, 10.0, 10);
      listaProdutos.push(produto);

      produto = new Produto(12, "Capacete de Ciclismo", 160.0, 0.28, 18);
      listaProdutos.push(produto);

      produto = new Produto(13, "Corda de Pular Veloz", 25.0, 0.12, 60);
      listaProdutos.push(produto);

      produto = new Produto(14, "Mochila de Hidratação", 210.0, 0.4, 14);
      listaProdutos.push(produto);

      produto = new Produto(15, "Kimono de Jiu-Jitsu", 380.0, 1.8, 7);
      listaProdutos.push(produto);

      function mostrarListaProdutos(listaProdutos) {
        let listagem = "<br>";
        listagem += "<strong>Nome | Preço Unitário </strong><br>";
        listagem += "------------------------------------------------<br>";
        for (let i = 0; i < listaProdutos.length; i++) {
          const linha = listaProdutos[i];
          listagem +=
            linha.nome + " - R$ " + linha.precoUnitario.toFixed(2) + "<br>";
        }
        return listagem;
      }

      function produtoMaisPesado(listaProdutos) {
        let maisPesado = listaProdutos[0].peso;
        let pos = 0;
        for (let i = 1; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          if (linha.peso > maisPesado) {
            maisPesado = linha.peso;
            pos = i;
          }
        }
        return (
          "Produto mais pesado: " +
          listaProdutos[pos].nome +
          " - " +
          listaProdutos[pos].peso.toFixed(2) +
          " kg"
        );
      }

      function mostrarProdutoMaisPesado() {
        document.getElementById("resposta").innerHTML =
          produtoMaisPesado(listaProdutos);
      }

      function listarTodosOsProdutos() {
        document.getElementById("resposta").innerHTML =
          mostrarListaProdutos(listaProdutos);
      }

      function mostrarProdutoMaisLeve() {
        let maisLeve = listaProdutos[0].peso;
        let pos = 0;
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          if (linha.peso < maisLeve) {
            maisLeve = linha.peso;
            pos = i;
          }
        }
        document.getElementById("resposta").innerHTML =
          "O produto mais leve é o " +
          listaProdutos[pos].nome +
          " - " +
          listaProdutos[pos].peso.toFixed(2) +
          "kg" +
          " na posição " +
          pos;
      }

      function ProdutoMaisCaro() {
        let maisCaro = listaProdutos[0].precoUnitario;
        let pos = 0;
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          if (linha.precoUnitario > maisCaro) {
            maisCaro = linha.precoUnitario;
            pos = i;
          }
        }
        document.getElementById("resposta").innerHTML =
          "O produto mais caro é o " +
          listaProdutos[pos].nome +
          " - " +
          listaProdutos[pos].precoUnitario +
          "R$";
      }

      function ProdutoMaisBarato() {
        let maisBarato = listaProdutos[0].precoUnitario;
        let pos = 0;
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          if (linha.precoUnitario < maisBarato) {
            maisBarato = linha.precoUnitario;
            pos = i;
          }
        }
        document.getElementById("resposta").innerHTML =
          "O produto mais barato é o " +
          listaProdutos[pos].nome +
          " - " +
          listaProdutos[pos].precoUnitario +
          "R$";
      }

      function MediaDePrecos() {
        let soma = 0;
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          soma += linha.precoUnitario;
        }
        let media = soma / listaProdutos.length;
        document.getElementById("resposta").innerHTML =
          "A média dos preços é " + media + "R$";
      }

      function MediaDePeso() {
        let soma = 0;
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          soma += linha.peso;
        }
        let media = soma / listaProdutos.length;
        document.getElementById("resposta").innerHTML =
          "A média dos pesos é " + media.toFixed(2) + "Kg";
      }

      function AlertaEstoque() {
        let tudo = " ";
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          if (linha.quantidadeEstoque < 10) {
            tudo +=
              linha.nome +
              " - " +
              linha.quantidadeEstoque +
              " produtos " +
              "<br>";
          }
        }
        document.getElementById("resposta").innerHTML = tudo;
      }

      function FiltroPreco() {
        let tudo = " ";
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          if (linha.precoUnitario <= 100) {
            tudo += linha.nome + " - " + linha.precoUnitario + "R$" + "<br>";
          }
        }
        document.getElementById("resposta").innerHTML = tudo;
      }

      function BuscarNome() {
        let nome = document.getElementById("buscado").value;
        let tudo = " ";
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          if (nome.toLowerCase() == linha.nome.toLowerCase()) {
            tudo =
              linha.id +
              " - " +
              linha.nome +
              " - " +
              linha.precoUnitario +
              "R$ - " +
              linha.peso +
              "Kg - " +
              linha.quantidadeEstoque +
              " no estoque";
          }
        }
        document.getElementById("resposta").innerHTML = tudo;
      }

      function ValorEmEstoque() {
        let tudo = " ";
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          tudo +=
            linha.nome +
            " possui um total de " +
            linha.quantidadeEstoque * linha.precoUnitario +
            "R$ em estoque" +
            "<br>";
        }
        document.getElementById("resposta").innerHTML = tudo;
      }

      function ValorTotal() {
        let tudo = 0;
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          tudo += linha.quantidadeEstoque * linha.precoUnitario;
        }
        document.getElementById("resposta").innerHTML = tudo.toFixed(2) + "R$";
      }

      function TotalPecas() {
        let tudo = 0;
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          tudo += linha.quantidadeEstoque;
        }
        document.getElementById("resposta").innerHTML = tudo + " peças";
      }

      function PesoTotalCarga() {
        let tudo = 0;
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          tudo += linha.peso * linha.quantidadeEstoque;
        }
        document.getElementById("resposta").innerHTML = tudo.toFixed(2) + "Kg";
      }

      function EntradaMercadoria() {
        let id = parseInt(document.getElementById("id").value);
        let quantidade = parseInt(document.getElementById("quantidade").value);
        let soma = 0;
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          if (id === linha.id) {
            soma = linha.quantidadeEstoque + quantidade;
          }
        }
        document.getElementById("resposta").innerHTML =
          "O produto com id " +
          id +
          " agora tem " +
          soma +
          " produtos em estoque";
      }

      function DescontoPromocional() {
        let tudo = " ";
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          if (linha.peso > 1) {
            tudo +=
              "O produto " +
              linha.nome +
              " após receber um desconto de 10%, agora custa " +
              (linha.precoUnitario - (linha.precoUnitario * 10) / 100).toFixed(
                2,
              ) +
              "R$" +
              "<br>";
          }
        }
        document.getElementById("resposta").innerHTML = tudo;
      }

      function ContagemPorCategoria() {
        let caros = " ";
        let baratos = " ";
        let medios = " ";
        for (let i = 0; i < listaProdutos.length; i++) {
          let linha = listaProdutos[i];
          if (linha.precoUnitario < 50) {
            baratos += linha.nome + "<br>";
          } else if (linha.precoUnitario > 50 && linha.precoUnitario < 200) {
            medios += linha.nome + "<br>";
          } else if (linha.precoUnitario > 200) {
            caros += linha.nome + "<br>";
          }
        }
        let resposta =
          "Baratos: " +
          "<br>" +
          baratos +
          "<br>" +
          "Médios: " +
          "<br>" +
          medios +
          "<br>" +
          "Caros: " +
          "<br>" +
          caros;
        document.getElementById("resposta").innerHTML = resposta;
      }

      function OrdenarPreco() {
        for (let i = 0; i < listaProdutos.length - 1; i++) {
          for (let j = 0; j < listaProdutos.length - 1; j++) {
            if (
              listaProdutos[j].precoUnitario >
              listaProdutos[j + 1].precoUnitario
            ) {
              let aux = listaProdutos[j];

              listaProdutos[j] = listaProdutos[j + 1];

              listaProdutos[j + 1] = aux;
            }
          }
        }

        document.getElementById("resposta").innerHTML =
          mostrarListaProdutos(listaProdutos);
      }
    </script>
  </body>
</html>
