<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <label for="nome">Nome: </label>
    <input type="text" id="nome" />
    <label for="CPF">CPF: </label>
    <input type="number" id="CPF" />
    <label for="nascimento">Data de nascimento: </label>
    <input type="text" id="nascimento" />
    <label for="altura">Altura: </label>
    <input type="number" id="altura" />
    <br />
    <script src="classe.js"></script>
    <button onclick="Adicionar()">Cadastrar Pessoa</button>
    <button onclick="ExibirTudo()">Exibir Tudo</button>
    <button onclick="ListarNomes()">Listar Nomes</button>
    <button onclick="NomeAltura()">Nome e Altura correspondente</button>
    <br />
    <input
      type="number"
      id="cpfbuscar"
      placeholder="CPF para buscar a pessoa"
    /><button onclick="Buscar()">Buscar CPF</button>
    <br />
    <input
      type="text"
      id="nomebuscar"
      placeholder="Nome para buscar a pessoa"
    /><button onclick="BuscNome()">Buscar Nome</button>
    <br />
    <span id="Resposta"> </span>
    <script>
      let listaPessoa = [];

      function Adicionar() {
        let CPF = document.getElementById("CPF").value;
        let nome = document.getElementById("nome").value;
        let nascimento = document.getElementById("nascimento").value;
        let altura = document.getElementById("altura").value;

        let p = new Pessoa(CPF, nome, nascimento, altura);
        listaPessoa.push(p);
      }

      function ExibirTudo() {
        let tudo = " ";

        for (let i = 0; i < listaPessoa.length; i++) {
          tudo +=
            "Nome: " +
            listaPessoa[i].nome +
            "<br>" +
            "CPF: " +
            listaPessoa[i].CPF +
            "<br>" +
            "Altura: " +
            listaPessoa[i].altura +
            "<br>" +
            "Data de nascimento: " +
            listaPessoa[i].nascimento +
            "<br><br>";
        }

        document.getElementById("Resposta").innerHTML = tudo;
      }

      function ListarNomes() {
        let nomes = " ";

        for (let i = 0; i < listaPessoa.length; i++) {
          nomes += listaPessoa[i].nome + "<br>";
        }
        document.getElementById("Resposta").innerHTML = nomes;
      }

      function NomeAltura() {
        let tudo = " ";

        for (let i = 0; i < listaPessoa.length; i++) {
          tudo +=
            "Nome: " +
            listaPessoa[i].nome +
            "<br> Altura: " +
            listaPessoa[i].altura +
            "<br><br>";
        }
        document.getElementById("Resposta").innerHTML = tudo;
      }

      function Buscar() {
        let cpfbuscar = document.getElementById("cpfbuscar").value;
        let resp = " ";

        for (let i = 0; i < listaPessoa.length; i++) {
          if (cpfbuscar === listaPessoa[i].CPF) {
            resp =
              "Nome: " +
              listaPessoa[i].nome +
              "<br> CPF: " +
              listaPessoa[i].CPF +
              "<br> Data de Nascimento: " +
              +listaPessoa[i].nascimento +
              "<br> Altura: " +
              listaPessoa[i].altura;
          }
        }
        document.getElementById("Resposta").innerHTML = resp;
      }

      function BuscNome() {
        let nomebuscar = document.getElementById("nomebuscar").value;
        let resp = " ";

        for (let i = 0; i < listaPessoa.length; i++) {
          if (nomebuscar.toLowerCase() === listaPessoa[i].nome.toLowerCase()) {
            resp =
              "Nome: " +
              listaPessoa[i].nome +
              "<br>" +
              "CPF: " +
              listaPessoa[i].CPF +
              "<br>" +
              "Data de Nascimento: " +
              listaPessoa[i].nascimento +
              "<br>" +
              "Altura: " +
              listaPessoa[i].altura;

            break;
          }
        }

        if (resp == " ") {
          alert("Esse nome não foi cadastrado");
        }

        document.getElementById("Resposta").innerHTML = resp;
      }

    </script>
  </body>
</html>
