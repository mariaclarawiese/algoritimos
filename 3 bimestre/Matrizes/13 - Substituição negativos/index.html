<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Substituir negativos</title>
  </head>
  <body>
    <h1>Substitui todos os números negativos da matriz por 0</h1>

    <label for="linhas">Linhas: </label>
    <input type="number" id="linhas" value="4" />

    <br /><br />

    <label for="colunas">Colunas: </label>
    <input type="number" id="colunas" value="4" />

    <br /><br />

    <label for="num">Números 1 por 1: </label>
    <input type="number" id="num" />

    <br /><br />

    <button onclick="Adicionar()">Adicionar a matriz</button>

    <button onclick="Exibir()">Exibir matriz</button>

    <button onclick="Substituir()">Substituir negativos</button>

    <br /><br />

    <p id="exibir"></p>

    <p id="resp"></p>

    <script>
      let matriz = [];
      let linhas;
      let colunas;
      let i = 0;
      let j = 0;

      function Matriz() {
        linhas = parseInt(document.getElementById("linhas").value);
        colunas = parseInt(document.getElementById("colunas").value);

        for (let i = 0; i < linhas; i++) {
          matriz[i] = [];
          for (let j = 0; j < colunas; j++) {
            matriz[i][j] = 0;
          }
        }
        return matriz;
      }

      function Adicionar() {
        let num = parseInt(document.getElementById("num").value);

        if (matriz.length == 0) {
            Matriz()
        } 

        if (j == colunas) {
            j = 0
            i++
        }

        if (i == linhas) {
            alert("ERRO, a matriz está cheia")
        }

        matriz[i][j] = num
        j++
      }

      function Exibir() {
        let aux = " ";

        for (let i = 0; i < linhas; i++) {
            for (let j = 0; j < colunas; j++) {
                aux += matriz[i][j] + " "
            }
            aux += "<br>"
        }
        document.getElementById("exibir").innerHTML = aux
      }

      function Substituir() {
        for (let i = 0; i < linhas; i++) {
            for (let j = 0; j < colunas; j++) {
                if (matriz[i][j] < 0) {
                    matriz[i][j] = 0
                }
            }
        }
        Exibir()
      }
    </script>
  </body>
</html>
