<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Numero em matrizes</title>
  </head>

  <body>
    <h1>
      Digitar um número e percorrer a matriz para achar se existe esse número
      nela
    </h1>

    <label for="linhas">Linhas: </label>
    <input type="number" id="linhas" value="4" />

    <br /><br />

    <label for="colunas">Colunas: </label>
    <input type="number" id="colunas" value="4" />

    <br /><br />

    <label for="num">Números 1 por 1: </label>
    <input type="number" id="num" />

    <br /><br />

    <label for="numero">Número a ser procurado: </label>
    <input type="number" id="numero" />

    <br /><br />

    <button onclick="Adicionar()">Adicionar a matriz</button>
    <button onclick="Exibir()">Exibir a matriz</button>
    <button onclick="Buscar()">Buscar o número</button>

    <br /><br />

    <p id="exibir"></p>
    <p id="resp"></p>

    <script>
      let matriz = [];

      let linhas;
      let colunas;

      let i = 0;
      let j = 0;

      function Matriz() {
        linhas = document.getElementById("linhas").value;
        colunas = document.getElementById("colunas").value;

        for (let i = 0; i < linhas; i++) {
          matriz[i] = [];

          for (let j = 0; j < colunas; j++) {
            matriz[i][j] = 0;
          }
        }

        return matriz;
      }

      function Adicionar() {
        let num = document.getElementById("num").value;

        if (matriz.length == 0) {
          Matriz();
        }

        if (i == linhas) {
          alert("Matriz cheia");
          return;
        }

        if (j == colunas) {
          j = 0;
          i++;
        }

        if (i == linhas) {
          alert("Matriz cheia");
          return;
        }

        matriz[i][j] = num;

        j++;
      }

      function Exibir() {
        let aux = "";

        for (let i = 0; i < linhas; i++) {
          for (let j = 0; j < colunas; j++) {
            aux += matriz[i][j] + " ";
          }

          aux += "<br>";
        }

        document.getElementById("exibir").innerHTML = aux;
      }

      function Buscar() {
        let numero = document.getElementById("numero").value;

        let posicao = ""

        let achou = false;

        for (let i = 0; i < linhas; i++) {
          for (let j = 0; j < colunas; j++) {
            if (matriz[i][j] == numero) {
              achou = true;

              posicao += "linha " + (i + 1) + " e coluna " + (j + 1) + "<br>";
            }
          }
        }

        if (achou == true) {
          document.getElementById("resp").innerHTML =
            "O número " + numero + " existe na matriz, e está na " + posicao;
        } else {
          document.getElementById("resp").innerHTML =
            "O número " + numero + " não existe na matriz.";
        }
      }
    </script>
  </body>
</html>
