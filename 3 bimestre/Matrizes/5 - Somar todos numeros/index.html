<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somar numeros</title>
  </head>
  <body>
    <h1>Somar todos os números de um vetor</h1>

    <label for="linhas">Linhas: </label>
    <input type="number" id="linhas" value="4" />

    <br /><br />

    <label for="colunas">Colunas: </label>
    <input type="number" id="colunas" value="4" />

    <br /><br />

    <label for="num">Números 1 por 1: </label>
    <input type="number" id="num" />

    <br /><br />

    <button onclick="Adicionar()">Adicionar a matriz</button>
    <button onclick="Exibir()">Exibir matriz</button>
    <button onclick="Somar()">Somar</button>

    <br /><br />

    <p id="exibir"></p>

    <p id="soma"></p>

    <script>
      let matriz = [];
      let linhas;
      let colunas;

      function Matriz() {
        linhas = document.getElementById("linhas").value;
        colunas = document.getElementById("colunas").value;

        for (let i = 0; i < linhas; i++) {
          matriz[i] = [];
          for (let j = 0; j < colunas; j++) {
            matriz[i][j] = 0;
          }
        }
        return matriz;
      }

      let i = 0;
      let j = 0;
      function Adicionar() {
        let num = parseInt(document.getElementById("num").value);

        if (matriz.length == 0) {
          Matriz();
        }

        if (j == colunas) {
          j = 0;
          i++;
        }

        if (i == linhas) {
          alert("O vetor está cheio");
          return;
        }

        matriz[i][j] = num;
        j++;
      }

      function Exibir() {
        let aux = "";

        for (let i = 0; i < linhas; i++) {
          for (let j = 0; j < colunas; j++) {
            aux += matriz[i][j] + " ";
          }
          aux += "<br>";
        }
        document.getElementById("exibir").innerHTML = aux;
      }

      function Somar() {
        let aux = 0

        for (let i = 0; i < linhas; i++) {
            for (let j = 0; j < colunas; j++) {
                aux += matriz[i][j]
            }
        }
        document.getElementById("soma").innerHTML = aux;
      }
    </script>
  </body>
</html>
