<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matriz simetrica</title>
  </head>
  <body>
    <h1>Ver se uma matriz é simétrica</h1>

    <label for="linhas">Linhas: </label>
    <input type="number" id="linhas" value="4" />

    <br />
    <br />

    <label for="colunas">Colunas: </label>
    <input type="number" id="colunas" value="4" />

    <br />
    <br />

    <label for="num">Número: </label>
    <input type="number" id="num" />

    <br />
    <br />

    <button onclick="Adicionar()">Adicionar</button>
    <button onclick="Exibir()">Exibir</button>
    <button onclick="Verificar()"></button>

    <p id="resp"> </p>
    <p id="simetrica"></p>

    <script>
      let matriz = [];
      let linhas;
      let colunas;

      function Matriz() {
         colunas = parseInt(document.getElementById("colunas").value)
         linhas = parseInt(document.getElementById("linhas").value)
        for (let i = 0; i < linhas; i++) {
          matriz[i] = [];

          for (let j = 0; j < colunas; j++) {
            matriz[i][j] = 0;
          }
        }
        return matriz;
      }

      let i = 0
      let j = 0
      function Adicionar() {
        let num = parseInt(document.getElementById("num").value);

        if (matriz.length == 0) {
            Matriz()
        }
        if (j == colunas) {
            j = 0
            i++
        }

        if (i == linhas) {
            alert("A matriz está cheia")
            return
        }

        matriz[i][j] = num

        j++
      }

      function Exibir() {
        let aux = " ";

        for (let i = 0; i < linhas; i++) {
            for (let j = 0; j < colunas; j++) {
                aux += matriz[i][j] + " "
            }
            aux += "<br>"
        }

        document.getElementById("resp").innerHTML = aux
      }

      function Verificar() {
        let transposta = [];

        for (let i = 0; i < colunas; i++) {
          transposta[i] = [];

          for (let j = 0; j < linhas; j++) {
            transposta[i][j] = matriz[j][i];
          }
        }

        let aux = "";

        for (let i = 0; i < colunas; i++) {
          for (let j = 0; j < linhas; j++) {
            aux += transposta[i][j] + " ";
          }

          aux += "<br>";
        }
        let cont = 0
        for (let i = 0; i < linhas; i++) {
            for (let j = 0; j < colunas; j++) {
                if (matriz[i][j] == transposta[i][j]) {
                    cont++
                }

            }
        }
        let resp = " "
        if (cont == linhas * colunas) {
            resp = "É uma matriz simétrica"
        } else {
            resp = "Não é uma matriz simétrica"
        }

        document.getElementById("simetrica").innerHTML = resp
    }
    </script>
  </body>
</html>
