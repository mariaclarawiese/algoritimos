<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeros pares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Ler um número e escrever todos os números pares de 1 até esse número</h1>

    <label for="numero">Número: </label>
    <input type="number" id="numero" placeholder="Digite o número aqui">

    <br>

    <input type="button" id="button" value="Calcular pares" onclick="Calcular()">

    <br>

    <span id="resp"> </span>

    <script>
        function Calcular() {
            let numero = parseInt(document.getElementById("numero").value);

            let resposta = Pares(numero)

            document.getElementById("resp").innerHTML = resposta
        }

        function Pares(numero) {
            let aux = " ";
            let i = 1;

            while (i <= numero) {
                if (i %2 === 0) {
                    aux = aux + i + ", ";
                }
                i++
            }

            return aux
        }
    </script>

    
</body>
</html>
