<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma numeros impares</title>
</head>
<body>
    <h1>Soma de números impares de 1 até o digitado</h1>
    <br>
    <label for="numero">Até que número ele vai: </label>
    <input type="number" id="numero">
    <br>
    <button id="button" onclick="Calcular()">Calcular</button>
    <br>
    <span id = "resp"> </span>
    
    <script>
        function Calcular() {
            let num = parseInt(document.getElementById("numero").value);
            let resposta = "A soma dos números ímpares de 1 até " + num + " é " + Impares(num);

            document.getElementById("resp").innerHTML = resposta
        }

        function Impares(num) {
            let aux = 0

            for (let i = 1; i <= num; i++) {
                if (i % 2 == 1) {
                    aux += i
                } else {
                    aux = aux
                }
            }
            return aux
        }
    </script>
    
</body>
</html>
