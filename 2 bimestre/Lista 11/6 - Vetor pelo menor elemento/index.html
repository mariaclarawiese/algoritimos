<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vetor pelo menor elemento</title>
  </head>
  <body>
    <label for="num">Digite os números um de cada vez: </label>
    <input type="number" id="num" />
    <br />
    <button onclick="Adicionar()">Adicionar</button>
    <button onclick="Calcular()">Separar</button>
    <br />
    <br />
    <span id="mostrar">Digitado: [ ]</span>
    <br />
    <br />
    <span id="resp">A resposta aparecerá aqui</span>

    <script>
      let vetor = [];

      function Adicionar() {
        let num = parseInt(document.getElementById("num").value);

        if (vetor.length >= 10) {
          alert("ERRO, digite apenas 10 números");
          return;
        }

        vetor.push(num);

        document.getElementById("mostrar").innerHTML =
          "Digitado: [" + vetor + "]";
      }

      function Calcular() {
        let menor = vetor[0];
        let posicao = 0;

        for (let i = 1; i < vetor.length; i++) {
          if (vetor[i] < menor) {
            menor = vetor[i];
            posicao = i;
          }
        }
        let divisao = [];

        for (let i = 0; i < vetor.length; i++) {
          divisao.push(vetor[i] / menor);
        }

        document.getElementById("resp").innerHTML =
          "O menor número é: " +
          menor +
          " e sua posição é " +
          posicao +
          "<br>Vetor de divisões: [" +
          divisao +
          "]";
      }
    </script>
  </body>
</html>
