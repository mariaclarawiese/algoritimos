<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordem de vetor</title>
  </head>
  <body>
    <label for="num">Digite os números um de cada vez: </label>
    <input type="number" id="num" />
    <br />
    <button onclick="Adicionar()">Adicionar</button>
    <button onclick="Crescente()">Ordem crescente</button>
    <button onclick="Decrescente()">Ordem decrescente</button>
    <br />
    <br />
    <span id="mostrar">Digitado: [ ]</span>
    <br />
    <br />
    <span id="resp">A resposta aparecerá aqui</span>

    <script>
      let vetor = [];

      function Adicionar() {
        let num = parseInt(document.getElementById("num").value);

        vetor.push(num);

        document.getElementById("mostrar").innerHTML =
          "Digitado: [" + vetor + "]";
      }

      function Crescente() {
        for (let j = 0; j < vetor.length - 1; j++) {
          for (let i = 0; i < vetor.length - 1; i++) {
            if (vetor[i] > vetor[i + 1]) {
              let aux = vetor[i];
              vetor[i] = vetor[i + 1];
              vetor[i + 1] = aux;
            }
          }
        }
        document.getElementById("resp").innerHTML = vetor;
      }

      function Decrescente() {
        for (let j = 0; j < vetor.length - 1; j++) {
          for (let i = 0; i < vetor.length - 1; i++) {
            if (vetor[i] < vetor[i + 1]) {
              let aux = vetor[i];
              vetor[i] = vetor[i + 1];
              vetor[i + 1] = aux;
            }
          }
        }

        document.getElementById("resp").innerHTML = vetor;
      }
    </script>
  </body>
</html>
