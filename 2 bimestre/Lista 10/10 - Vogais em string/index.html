<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contar vogais</title>
  </head>
  <body>
    <label for="frase">Digite aqui: </label>
    <input type="text" id="frase" />
    <br />
    <button onclick="Calcular()">Contar</button>
    <br />
    <span id="resp"> </span>

    <script>
      function Calcular() {
          let frase = document.getElementById("frase").value;
          let resposta = Contar(frase);

          document.getElementById("resp").innerHTML = "Tem " + resposta + " vogais"
      }

      function Contar(frase) {
          let aux = 0

          for (let i = 0; i < frase.length; i++) {
              if (frase[i].toLowerCase() == "a" || frase[i].toLowerCase() == "e" || frase[i].toLowerCase() == "i" || frase[i].toLowerCase() == "o" || frase[i].toLowerCase() == "u") {
                  aux += 1
          }
          
      }
      return aux
    }
    </script>
  </body>
</html>
