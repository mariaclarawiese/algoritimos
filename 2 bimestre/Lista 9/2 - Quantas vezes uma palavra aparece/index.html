<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem palavra</title>
</head>
<body>
    <label for="frase">Frase: </label>
    <input type="text" id="frase">
    <br>
    <label for="palavra">Palavra:</label>
    <input type="text" id="palavra">
    <br>
    <button onclick="Calcular()">Contar</button>
    <br>
    <span id="resp"> </span>

    <script>
        function Calcular() {
            let frase = document.getElementById("frase").value;
            let palavra = document.getElementById("palavra").value;
            let resposta = Contar(frase, palavra);

            document.getElementById("resp").innerHTML = resposta;
        }

        function Contar(frase, palavra) {
            let palavras = frase.split(" ");
            let aux = 0

            for (let i = 0; i < palavras.length; i++) {
                if (palavras[i].toLowerCase() == palavra.toLowerCase()) {
                    aux++
                } else {
                    aux = aux
                }
            }
            return aux;
        }
    </script>
    
</body>
</html>
