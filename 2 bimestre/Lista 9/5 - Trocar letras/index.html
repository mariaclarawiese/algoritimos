<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar letras</title>
</head>
<body>
    <h1>Trocas letras maiúsculas por minúsculas e vice versa</h1>
    <br>
    <label for="frase">Frase: </label>
    <input type="text" id="frase">
    <br>
    <button id="button" onclick="Calcular()">Trocar</button>
    <br>
    <span id="resp"> </span>

    <script>
        function Calcular() {
            let frase = document.getElementById("frase").value;
            let resposta = Troca(frase)

            document.getElementById("resp").innerHTML = resposta
        }

        function Troca(frase) {
            let aux = "";
            
            for (let i = 0; i < frase.length; i++) {
                if(frase[i] === frase[i].toLowerCase()) {
                    aux += frase[i].toUpperCase()
                } else if (frase[i] === frase[i].toUpperCase()) {
                    aux += frase[i].toLowerCase()
                }
            }
            return aux
        }
    </script>
    
</body>
</html>
