<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Loteria</title>

    <style>
      body {
        background-color: black;
        color: #00ff99;
        font-family: monospace;
      }

      button {
        background: #00ff99;
        border: none;
        padding: 5px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h2>> SISTEMA LOTERIA ESPECIAL</h2>

    <label>Nome:</label>
    <input type="text" id="nome" />
    <br /><br />

    <label>Endereço:</label>
    <input type="text" id="endereco" />
    <br /><br />

    <label>Resposta (1,2 ou 3):</label>
    <input type="number" id="resposta" />

    <button onclick="Adicionar()">Adicionar</button>
    <button onclick="Calcular()">Conferir</button>

    <p id="log"></p>
    <p id="resp"></p>
    <h1 id="ganhador"></h1>

    <script>
      const gabarito = [1, 2, 3, 1, 2, 3, 1, 2, 3, 1, 2, 3, 1];
      let aposta = [];

      function Adicionar() {
        if (aposta.length >= 13) {
          alert("Limite atingido (13 respostas)");
          return;
        }

        let numero = Number(document.getElementById("resposta").value);

        aposta.push(numero);

        // efeito "terminal"
        document.getElementById("log").innerHTML =
          "> registrando...<br>" +
          "entrada " + aposta.length + ": " + numero + "<br><br>" +
          "vetor atual: [" + aposta.join(" | ") + "]";
      }

      function Calcular() {
        if (aposta.length < 13) {
          alert("Faltam respostas.");
          return;
        }

        let acertos = 0;

        for (let i = 0; i < 13; i++) {
          if (aposta[i] == gabarito[i]) {
            acertos++;
          }
        }

        let nome = document.getElementById("nome").value;
        let endereco = document.getElementById("endereco").value;

        document.getElementById("resp").innerHTML =
          "> usuário: " + nome +
          "<br>> localização: " + endereco +
          "<br>> acertos: " + acertos + "/13";

        if (acertos == 13) {
          document.getElementById("ganhador").innerHTML =
            ">>> GANHADOR DETECTADO <<<";
        }
      }
    </script>
  </body>
</html>
