<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Mandalorian</title>
  </head>
  <body>
    <label>Nome do caçador: </label>
    <input type="text" id="nome" />
    <br />

    <label>Dificuldade da missão (1, 2 ou 3): </label>
    <input type="number" id="dificuldade" />
    <br />

    <label>Valor base da recompensa: </label>
    <input type="number" id="vbase" />
    <br />

    <button onclick="Adicionar()">Adicionar</button>
    <button onclick="Calcular()">Exibir</button>

    <br /><br />

    <span id="resp"></span>

    <script>
      let Nome = [];
      let Dificul = [];
      let Vbase = [];

      function Adicionar() {
        let nome = document.getElementById("nome").value;
        let dificuldade = parseInt(document.getElementById("dificuldade").value);
        let vbase = parseFloat(document.getElementById("vbase").value);

        if (dificuldade != 1 && dificuldade != 2 && dificuldade != 3) {
          alert("ERRO! Digite 1, 2 ou 3.");
          return;
        }

        Nome.push(nome);
        Dificul.push(dificuldade);
        Vbase.push(vbase);
      }

      function Bonus(valor, dificuldade) {
        if (dificuldade === 1) {
          return valor;
        } else if (dificuldade === 2) {
          return valor + (valor * 12) / 100;
        } else if (dificuldade === 3){
          return valor + (valor * 22) / 100;
        }
      }

      function Calcular() {
        let resposta = "";

        for (let i = 0; i < Nome.length; i++) {
          let bonus = Bonus(Vbase[i], Dificul[i]);

          resposta += "Caçador: " + Nome[i] + "<br>";
          resposta += "Dificuldade: " + Dificul[i] + "<br>";
          resposta += "Valor Base: R$ " + Vbase[i] + "<br>";
          resposta += "Valor Final: R$ " + bonus + "<br><br>";
        }

        document.getElementById("resp").innerHTML = resposta;
      }
    </script>
  </body>
</html>
