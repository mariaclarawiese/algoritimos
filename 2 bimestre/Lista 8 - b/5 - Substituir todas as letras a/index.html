<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substituir letras a</title>
</head>
<body>
    <h1>Substituir todas as letras a por @</h1>
    <br>
    <label for="frase">Frase que você vai trocar: </label>
    <input type="text" id="frase">
    <br>
    <button onclick="Calcular()">Trocar</button>
    <br>
    <span id="resp"> </span>

    <script>
        function Calcular() {
            let frase = document.getElementById("frase").value;
            let resposta = Trocar(frase);

            document.getElementById("resp").innerHTML = resposta
        } 

        function Trocar(frase) {
            let aux = " ";

            for (let i = 0; i < frase.length; i++) {
                if (frase[i].toLowerCase() === "a") {
                    aux += "@"
                } else {
                    aux += frase[i]
                }
            }
            return aux
        }
    </script>
    
</body>
</html>
