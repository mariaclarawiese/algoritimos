<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Numeros e operacoes</title>
</head>
<body>
    <h1>Ler 2 números e fazer a soma, subtração e a multiplicação deles</h1>

    <label for="N1">Número 1: </label>
    <input type="number" id="N1" placeholder="Digite o número aqui">

    <br>

    <label for="N2">Número 2: </label>
    <input type="number" id="N2" placeholder="Digite o número aqui">

    <br> 

    <input type="button" id="button" value="Calcular" onclick="Calcular()">


    <p id="multiplic">Multiplicação: </p>
    <p id="soma">Soma: </p>
    <p id="subtrac">Subtração N1 pelo N2: </p>

    <script>
        function Calcular() {
            let n1 = parseFloat(document.getElementById("N1").value)
            let n2 = parseFloat(document.getElementById("N2").value)

            let multiplicacao
            let soma 
            let subtracao 

            if (n1 === 0 || n2 === 0) {
                multiplicacao = "Erro, não pode 0"
                soma = "Erro, não pode 0"
                subtracao = "Erro, não pode 0"
            } else {
            multiplicacao = n1 * n2
            soma = n1 + n2
            subtracao = n1 - n2
            }

            document.getElementById("multiplic").innerHTML = "Multiplicação: " + multiplicacao
            document.getElementById("soma").innerHTML = "Soma: " + soma
            document.getElementById("subtrac").innerHTML = "Subtração N1 pelo N2: " + subtracao
        }

    </script>




</body>
</html>
