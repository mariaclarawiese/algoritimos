<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Polegadas - mm</title>
</head>
<body>
    
<h1>Número em polegadas para milímetros</h1>

<br>

<label for="numero">Número em polegadas: </label>
<input type="number" id="numero" placeholder="Digite o número aqui">

<br>

<input type="button" value="Calcular" id="button" onclick="calcular ()">

<br>

<label for="resultado">Resultado: </label>
<span id="resultado"></span>

<script>

    function calcular () {
        let numero = parseFloat(document.getElementById("numero").value)

        let resultado = numero * 25.4 

        document.getElementById("resultado").innerHTML = resultado
    }
</script>
</body>
</html>
