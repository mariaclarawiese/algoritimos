<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>numero ao quadrado</title>
</head>
<body>

    <h1>Número ao quadrado</h1>

    <br>

    <label for="numero">Número: </label>
    <input type="number" id="numero"
    placeholder="Digite o número">

    <br>

    <input type="button" id="button" value="calcular" onclick="funcaocalcular ()">

    <br>

    <label for="resposta">Resposta: </label>
    <span id="resposta"></span>

    <script>
        function funcaocalcular () {

            let numero= parseFloat(document.getElementById("numero").value)

            let resposta= (numero ** 2)

            document.getElementById("resposta").innerHTML= numero

        }




    </script>





</body>
</html>
