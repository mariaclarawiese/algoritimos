<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>divisao sem zero</title>
</head>
<body>
    <h1>Divisão sem o divisor sendo 0</h1>

    <label for="dividendo">Primeiro número (dividendo): </label>
    <input type="number" id="divisor" placeholder="Digite o número aqui">

    <br>

    <label for="divisor">Segundo número (divisor): </label>
    <input type="number" id="dividendo" placeholder="Digite o número aqui">

    <br>

    <input type="button" id="button" value="Calcular" onclick="Calcular()">

    <br>

    <p id="result">Resultado: </p>

    <script>
        function Calcular() {
            let n1 = parseFloat(document.getElementById("divisor").value);
            let n2 = parseFloat(document.getElementById("dividendo").value);

            let operacao = n1 / n2
            let resultado 

            if (n2 === 0) {
                resultado = "NÃO PODE DIVIDIR UM NÚMERO POR 0"
            } else {
                resultado = "A divisão do número " + n1 + " pelo número " + n2 + " é igual a " + operacao
            }

            document.getElementById("result").innerHTML = resultado
        }
    </script>
    
</body>
</html>
