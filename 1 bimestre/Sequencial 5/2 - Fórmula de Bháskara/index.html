    <title>Bhaskara</title>

<body>
    <h1>Resolver uma equação do segudo grau usando a fórmula de Bháskara</h1>

    <label for="inputA">Valor A: </label>
    <input type="number" id="inputA">

    <br>

    <label for="inputB">Valor B: </label>
    <input type="number" id="inputB">

    <br>

    <label for="inputC">Valor C: </label>
    <input type="number" id="inputC">

    <br>

    <input type="button" id="button" value="Resolver" onclick="Resolver()">

    <p id="result">Resultado: </p>

    <script>
        function Resolver() {
            let a = parseFloat(document.getElementById("inputA").value);
            let b = parseFloat(document.getElementById("inputB").value);
            let c = parseFloat(document.getElementById("inputC").value);

            let delta = (b ** 2) - 4 * a * c
            let x1 = (- (b) - Math.sqrt(delta)) / (2 * a)
            let x2 = (- (b) + Math.sqrt(delta)) / (2 * a)

            let resultado 

        if (delta < 0) {
            resultado = "Erro, o delta não pode ser um número negativo"
            } else {
                resultado = "As raízes são " + x1 + " e " +  x2 
            }
            
            document.getElementById("result").innerHTML = resultado
        }
    </script>
</body>
