<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Par ou impar</title>
</head>
<body>
    <h1>Determinar se um número é par ou ímpar</h1>

    <label for="numero">Número: </label>
    <input type="number" id="numero" placeholder="Digite o número aqui">

    <br>

    <input type="button" id="button" value="Determinar" onclick="determinar()">

    <p id="resp"> </p>

    <script>
        function ParImpar() {
            let number = parseFloat(document.getElementById("numero").value)
            let resto = number % 2 //resto da divisao por 2
            let resultado
            
            if (resto === 0) {
                return resultado = "O número " + number + " é par"
            } else {
                return resultado = "O número " + number + " é ímpar"
            }

        }
        

        function determinar() {
            let number = parseFloat(document.getElementById("numero").value)
            let resultado = ParImpar()

            document.getElementById("resp").innerHTML = resultado
        }
    </script>
    
</body>
</html>
