<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Media</title>
</head>
<body>
    <label for="identificacao">Número de identificação do aluno: </label>
    <input type="number" id="identificacao">

    <br>

    <label for="Nota1">Nota 1: </label>
    <input type="number" id="Nota1">

    <br>

    <label for="Nota2">Nota 2: </label>
    <input type="number" id="Nota2">

    <br>

    <label for="Nota3">Nota 3: </label>
    <input type="number" id="Nota3">

    <br>

    <label for="Nota4">Nota 4: </label>
    <input type="number" id="Nota4">

    <br>

    <label for="mediaexercicios">Média dos exercícios: </label>
    <input type="number" id="ME">

    <br>

    <input type="button" value="Calcular" onclick="Calcular()">

    <p id="resposta">O número do aluno, suas notas, a média dos exercícios, a média de aproveitamento, conceito correspondente e a mensagem aparecerão aqui</p>

    <script>
        function Conceito(MA) {
            let conceito
            if (MA > 10) {
                conceito = "Não tem como ser nota maior que 10"
            } else if (MA <= 10 && MA >= 9) {
                conceito = "A"
            } else if (MA <= 7.5 && MA < 9) {
                conceito = "B"
            } else if (MA >= 6 && MA < 7.5) {
                conceito = "C"
            } else if (MA >= 4 && MA < 6) {
                conceito = "D"
            } else if (MA < 4 && MA <= 0) {
                conceito = "E"
            } else if (MA < 0) {
                conceito = "Não tem como tirar nota menor que 0"
            }
            return conceito
        }

        function Mensagem(MA) {
            if (MA >=10 && MA < 6 ) {
                conceito = "APROVADO"
            } else {
                conceito = "REPROVADO"
            }
        }

        function Calcular() {
            let identificacao = parsefloat(document.getElementById("identificacao").value);
            let Nota1 = parseFloat(document.getElementById("Nota1").value);
            let Nota2 = parseFloat(document.getElementById("Nota2").value);
            let Nota3 = parseFloat(document.getElementById("Nota3").value);
            let Nota4 = parseFloat(document.getElementById("Nota4").value);
            let ME = parseFloat(document.getElementById("ME").value);

            let MA = (Nota1 + Nota2 * 2 + Nota3 * 3 + Nota4 * 4 + ME ) / 11;

            let conceito = Conceito(MA);

            let mensagem = Mensagem(conceito);
        }
    </script> 

    
</body>
</html>
