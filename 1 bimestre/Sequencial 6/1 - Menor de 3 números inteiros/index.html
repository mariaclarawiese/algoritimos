<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Menos de tres numeros</title>
</head>
<body>
    <h1>Menor de três numeros inteiros</h1>

    <label for="n1">Primeiro número: </label>
    <input type="number" id="n1" placeholder="Digite o número aqui">

    <br>

    <label for="n2">Segundo número: </label>
    <input type="number" id="n2" placeholder="Digite o número aqui">

    <br>

    <label for="n3">Terceiro número: </label>
    <input type="number" id="n3" placeholder="Digite o número aqui">

    <br>

    <input type="button" value="Verificar" onclick="Verificar ()">

    <p id="resultado">O menor número é: </p>

    <script>
        function Verificar () {
            let n1 = parseFloat(document.getElementById("n1").value);
            let n2 = parseFloat(document.getElementById("n2").value);
            let n3 = parseFloat(document.getElementById("n3").value);
            let resposta

            debugger;
            
            if (isNaN(n1) || isNaN(n2) || isNaN (n3)) {
                resposta = "Preencha todos os números"
            } else if (n1 <= n2 && n1 <= n3) {
                resposta = "O menor número é: " + n1 
            } else if (n2 <= n1 && n2 <= n3) {
                resposta = "O menor número é: " + n2
            } else if (n3 <= n2 && n3 <= n1) {
                resposta = "O menor número é: " + n3
            } 

            document.getElementById("resultado").innerHTML = resposta;

        }
    </script>
    
</body>
</html>
