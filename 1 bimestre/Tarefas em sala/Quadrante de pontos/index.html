<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Quadrante de pontos</title>
</head>
<body>
    <h1>Quadrante de pontos</h1>

    <label for="X">X: </label>
    <input type="number" id="X">

    <br>

    <label for="Y">Y: </label>
    <input type="number" id="Y">

    <br>

    <input type="button" id="button" value="Calcular" onclick="Calcular ()">

    <p id="resposta"></p>

    <script>
        function Calcular () {
            let X = parseFloat(document.getElementById("X").value);
            let Y = parseFloat(document.getElementById("Y").value);
            let resp

            if (X === 0 && Y === 0) {
                resp = "O ponto nao está em nenhum quadrante pois está no ponto central"
            } else if (X === 0 && Y !== 0 ) {
                resp = "O ponto não está em nenhum quadrante pois está sobre o eixo Y"
            } else if (X !== 0 && Y === 0) {
                resp = "O ponto não está em nenhum quadrante pois está sobre o eixo X"
            } else if (X > 0 && Y > 0) {
                resp = "O ponto está sobre o primeiro quadrante"
            } else if (X < 0 && Y > 0) {
                resp = "O ponto está sobre o segundo quadrante" 
            } else if (X < 0 && Y < 0) {
                resp = "O ponto está sobre o terceiro quadrante" 
            } else if (X > 0 && Y < 0) {
                resp = "O ponto está sobre o quarto quadrante" 
            }

            document.getElementById("resposta").innerHTML = resp
        }
    </script>
    

</body>
</html>
