<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Intervalo de numeros</title>
</head>
<body>
    
<h1>Numero maior ou igual a 3 e menor que 8</h1> 

<label for="inputX">Valor de X: </label>
<input type="number" id="inputX" placeholder="Digite o valor aqui">

<br>

<input type="button" id="button" value="Calcular" onclick="calcular()">

<p id="Resposta">A resposta sairá aqui</p>

<script>
    function calcular() {
        let x = parseFloat(document.getElementById("inputX").value)
        let resp = " "

        if (x >= 3 && x < 8) {
            resp = "O número "+x+" está no intervalo"
        } else {
            resp = "O número "+x+" não está no intervalo"
        }

        document.getElementById("Resposta").innerHTML = resp;
    }
</script>

</body>
</html>
