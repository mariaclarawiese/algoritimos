<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Certificado</title>
</head>
<body>
    <h1>Imprimir certifiado com o nome e a nota final</h1>

    <label for="nome">Nome: </label>
    <input type="text" id="nome" placeholder="Digite o nome aqui">

    <br>

    <label for="nota">Nota Final: </label>
    <input type="number" id="nota" placeholder="Digite a nota aqui">
    
    <br>

    <input type="button" id="button" value="Substituir" onclick="certificado ()">

    <br>

<p id="final">Certificamos que [Nome Completo da Pessoa] concluiu com êxito o Curso de Algoritimos. Sua dedicação e aprendizado foram avaliados com a nota [Nota Final]. Parabéns pela conquista e sucesso em seus futuros desafios!</p>
    
<script>
    function certificado () {
        let nome = document.getElementById("nome").value;
        let nota = parseFloat(document.getElementById("nota").value);

        document.getElementById("final").innerHTML = "Certificamos que " + nome + " concluiu com êxito o Curso de Algoritimos. Sua dedicação e aprendizado foram avaliados com a nota "+ nota + " . Parabéns pela conquista e sucesso em seus futuros desafios!"
}
</script>


</body>
</html>
