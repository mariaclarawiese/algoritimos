<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Graus para Fahrenheit</title>
</head>
<body>
    <h1>Graus para Fahrenheit</h1>

    <label for="graus">Temperatura (em graus): </label>
    <input type="number" id="graus" placeholder="Digite a temperatura aqui">

    <br>

    <input type="button" id="button" value="Converter" onclick="Calcular ()">

    <p id="convertido"></p>

    <script>
        function Calcular () {
            let graus = parseFloat(document.getElementById("graus").value)

            let conver = (graus * 1.8) + 32;

            document.getElementById("convertido").innerHTML = conver
        }
    </script>
    
</body>
</html>
