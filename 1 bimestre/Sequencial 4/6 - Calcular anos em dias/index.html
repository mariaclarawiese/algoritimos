<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Idade em dias</title>
</head>
<body>
    <h1>Calcular a idade de uma pessoa em dias, considerando que os meses tenham 30 dias</h1>

    <label for="idadeAnos">Anos: </label>
    <input type="number" id="idadeAnos">

    <br>

    <label for="idadeAnos">Meses: </label>
    <input type="number" id="idadeMeses">

    <br>

    <label for="idadeAnos">Dias: </label>
    <input type="number" id="idadeDias">

    <br>

    <input type="button" id="button" value="Calcular" onclick="Calcular ()">

    <p id="resultado"></p>

    <script>
        function Calcular () {
            let idadeAnos = parseFloat(document.getElementById("idadeAnos").value)
            let idadeDias = parseFloat(document.getElementById("idadeDias").value)
            let idadeMeses = parseFloat(document.getElementById("idadeMeses").value)

            let Anos = idadeAnos * 360
            let Dias = idadeDias * 1 
            let Meses = idadeMeses * 30 

            let tudo = Anos + Meses + Dias 

            document.getElementById("resultado").innerHTML = "Sua idade em dias é " + tudo

           }
    </script>
</body>
</html>
